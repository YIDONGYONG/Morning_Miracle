# Render Blueprint: 無料の Web Service と無料の PostgreSQL を一括で作る
# 注意: 無料 Postgres は作成から30日で期限切れになる。無料 Web は15分アクセスがないとスリープする
databases:
  - name: miracle-db
    plan: free
    databaseName: miracle_production
    user: miracle

services:
  - type: web
    name: miracle-morning
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY_BASE   # master.key を共有せず、Render 側で自動生成する
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: miracle-db
          property: connectionString
